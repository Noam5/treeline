appId: dev.treeline.app
productName: Treeline
directories:
  output: dist
  buildResources: build
files:
  - electron/**
  - "!electron/test/**"
  - server/src/**
  - web/dist/**
  - package.json
# express.static reading through an asar archive is a known soft spot;
# unpack just the frontend so serve-static touches the real filesystem.
# This path must stay in sync with resolveWebDist() in electron/runtime.js.
asarUnpack:
  - web/dist/**
linux:
  target: [AppImage, deb]
  category: Development
  icon: build/icon.png
  maintainer: noam <246069+Noam5@users.noreply.github.com>
deb:
  # electron-builder's default dependencies, plus git, which the app shells out to.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - git
